name: MLIR CUDA fusion
on:
  push:
    paths: ['mlir-cuda-fusion/**', '.github/workflows/mlir-cuda-fusion.yml']
  pull_request:
    paths: ['mlir-cuda-fusion/**', '.github/workflows/mlir-cuda-fusion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mlir-cuda-fusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build llvm-19-dev libmlir-19-dev mlir-19-tools
      - run: python -m pip install -e .
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMLIR_DIR=/usr/lib/llvm-19/lib/cmake/mlir
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure
