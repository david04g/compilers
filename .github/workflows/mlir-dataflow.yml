name: MLIR dataflow
on:
  push:
    paths: ['mlir-dataflow/**', '.github/workflows/mlir-dataflow.yml']
  pull_request:
    paths: ['mlir-dataflow/**', '.github/workflows/mlir-dataflow.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: mlir-dataflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  compiler:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mlir-dataflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build llvm-19-dev libmlir-19-dev mlir-19-tools
      - run: python -m pip install -e .
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMLIR_DIR=/usr/lib/llvm-19/lib/cmake/mlir
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure
      - run: python -m dataflow.experiments --compiler build/dataflow-opt --output out/sweep
      - uses: actions/upload-artifact@v4
        with:
          name: dataflow-sweep
          path: mlir-dataflow/out/sweep/
