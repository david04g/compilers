[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlir-dataflow-sim"
version = "0.1.0"
description = "Execution-plan simulator and experiments for a small MLIR backend"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
dataflow-sim = "dataflow.simulator:main"
dataflow-sweep = "dataflow.experiments:main"
dataflow-generate = "dataflow.generate:main"

[tool.setuptools.packages.find]
where = ["python"]
